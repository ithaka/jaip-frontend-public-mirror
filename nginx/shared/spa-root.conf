# Fingerprinted build assets must 404 when missing rather than falling through to
# index.html - serving the SPA shell as "text/html" for a .mjs/.css request triggers
# a MIME check in Firefox, and CDNs can cache that bad response.
location ~* \.(?:mjs|js|css|map)$ {
  root   /usr/share/nginx/html;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# /api is normally routed to the backend upstream before reaching
# this container, but ensure it's never cacheable if it ever does land here.
location ^~ /api/ {
  add_header Cache-Control "no-store";
  try_files $uri =404;
}

location / {
  root   /usr/share/nginx/html;
  index  index.html;
  # index.html references hashed asset filenames that change every deploy. Fastly caches by
  # full URL (path + query string) by default, so a purge of "/" doesn't clear variants like
  # "/?term=&page=1" - Surrogate-Control tells Fastly to never cache this response at all.
  add_header Cache-Control "no-store";
  add_header Surrogate-Control "no-store";
  try_files $uri $uri/ /index.html;
}
